<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify Code | Boho Soul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #ffffff;
    }

    .page-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* LEFT SECTION */
    .form-section {
      width: 50%;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      margin-bottom: 30px;
    }

    .logo img {
      width: 120px;
    }

    .back-link {
      font-size: 14px;
      color: #555;
      margin-bottom: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .back-link i {
      font-size: 12px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #000;
    }

    .sub-text {
      font-size: 14px;
      color: #666;
      margin-bottom: 35px;
      max-width: 420px;
    }

    .form-group {
      margin-bottom: 16px;
      max-width: 420px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 8px;
      color: #000;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #1e88e5;
    }

    .resend-text {
      font-size: 13px;
      color: #555;
      margin: 14px 0 30px;
    }

    .resend-text span {
      color: #e53935;
      cursor: pointer;
      font-weight: 500;
    }

    .submit-btn {
      width: 420px;
      max-width: 100%;
      background: #1e88e5;
      border: none;
      padding: 14px;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #166fc0;
    }

    /* RIGHT SECTION */
    .image-section {
      width: 50%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .image-card {
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .image-card img {
      width: 100%;
      display: block;
    }

    .slider-dots {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #d1d1d1;
      border-radius: 50%;
    }

    .dot.active {
      width: 22px;
      border-radius: 6px;
      background: #1e88e5;
    }

    /* RESPONSIVE */
    @media (max-width: 992px) {
      .page-wrapper {
        flex-direction: column;
      }

      .form-section,
      .image-section {
        width: 100%;
      }

      .form-section {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- LEFT FORM -->
    <div class="form-section">

      <div class="logo">
        <!-- Replace with original logo -->
        <img src="Boho_Soul-removebg-preview.png" alt="Boho Soul">
      </div>

    <a href="Login.html" class="back-link">
    <i class="fa-solid fa-arrow-left"></i> Back to login
    </a>

      <h1>Verify code</h1>
      <p class="sub-text">
        An authentication code has been sent to your email.
      </p>

      <div class="form-group">
        <label>Enter Code</label>
        <input type="text" value="7789BM6X">
      </div>

      <p class="resend-text">
        Didn’t receive a code? <span>Resend</span>
      </p>

    <div class="text-center mt-4">
    <a href="checkout.html" class="btn btn-primary px-4">
        Proceed to Checkout
    </a>

    <!-- RIGHT IMAGE -->
    <div class="image-section">
      <div class="image-card">
        <!-- Replace with your actual image -->
        <img src="verify.jpg" alt="Fashion">

  </div>

</body>
</html>
