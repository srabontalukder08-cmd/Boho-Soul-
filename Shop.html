<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shop | Boho Soul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:#f5f6f8;
}

/* ---------- NAVBAR ---------- */
.navbar{
  background:#fff;
  border-bottom:1px solid #e5e5e5;
}
.navbar-brand img{width:90px;}
.nav-icon{font-size:20px;margin-left:15px;}

/* ---------- SEARCH BAR ---------- */
.search-box{
  background:#f1f1f1;
  border-radius:50px;
  padding:8px 15px;
  display:flex;
  align-items:center;
}
.search-box input{
  border:none;
  background:transparent;
  outline:none;
  width:200px;
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:#fff;
  padding:20px;
  border-radius:12px;
}
.sidebar h6{
  font-weight:600;
  margin-bottom:12px;
}
.filter-item{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
  font-size:14px;
}
.more-btn{
  font-size:13px;
  color:#0d6efd;
  cursor:pointer;
}

/* ---------- PRODUCT CARD ---------- */
.product-card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  transition:.3s;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.product-card:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(0,0,0,.15);
}
.product-img-wrap{position:relative;}
.product-img{
  width:100%;
  height:250px;
  object-fit:cover;
}
.badge-new{
  position:absolute;
  top:12px;
  left:12px;
  background:#f7931e;
  color:#fff;
  font-size:12px;
  padding:4px 8px;
  border-radius:6px;
}
.overlay{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  opacity:0;
  transition:.3s;
}
.product-card:hover .overlay{opacity:1;}
.icon-btn{
  width:36px;
  height:36px;
  background:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.product-body{padding:14px;}
.product-title{
  font-size:14px;
  font-weight:600;
}
.rating{color:#f1c40f;font-size:13px;}
.price{font-weight:700;font-size:16px;}

/* ---------- PAGINATION ---------- */
.pagination .page-link{
  border-radius:8px;
  margin:0 4px;
  cursor:pointer;
}
</style>
</head>
<body>

<!-- ========== NAVBAR ========== -->
<nav class="navbar navbar-expand-lg bg-white py-3 border-bottom">
  <div class="container-fluid">

    <!-- Mobile Logo -->
    <a class="navbar-brand d-lg-none logo" href="index.html">
      <img src="Boho_Soul-removebg-preview.png" alt="Boho Soul">
    </a>

    <!-- Toggle -->
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu -->
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 mt-3 mt-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Shop</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="Summer Clothes.html">Summer Clothes</a></li>
            <li><a class="dropdown-item" href="#">Winter Clothes</a></li>
            <li><a class="dropdown-item" href="#">Formal Wear</a></li>
            <li><a class="dropdown-item" href="#">Sleeping Clothes</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="About.html">About</a>
        </li>

        <li class="nav-item"><a class="nav-link" href="Contact.html">Contact</a></li>
      </ul>

      <div class="d-flex align-items-center mt-3 mt-lg-0">
        <form class="d-flex me-3">
          <input class="form-control me-2" type="search" placeholder="Search">
          <button class="btn btn-outline-primary">Search</button>
        </form>

        <a href="Sign up.html" class="nav-icon"><i class="bi bi-person"></i></a>
        <a href="cart.html" class="nav-icon"><i class="bi bi-cart3"></i></a>
      </div>
    </div>

    <!-- Desktop Center Logo -->
    <a class="navbar-brand d-none d-lg-block logo navbar-brand-center" href="index.html">
      <img src="Boho_Soul-removebg-preview.png" alt="Boho Soul">
    </a>

  </div>
</nav>

<!-- MAIN -->
<div class="container my-5">
<div class="row">

<!-- SIDEBAR -->
<div class="col-lg-3 mb-4">
<div class="sidebar">

<h6>Categories</h6>
<div class="filter-item"><input type="checkbox"> Tops</div>
<div class="filter-item"><input type="checkbox"> Dresses</div>
<div class="filter-item"><input type="checkbox"> Jackets</div>

<div id="catMore" style="display:none">
  <div class="filter-item"><input type="checkbox"> Hoodies</div>
  <div class="filter-item"><input type="checkbox"> Shirts</div>
</div>
<div class="more-btn" onclick="toggleMore('catMore',this)">More</div>

<hr>

<h6>Brands</h6>
<div class="filter-item"><input type="checkbox"> Zara</div>
<div class="filter-item"><input type="checkbox"> H&M</div>
<div class="filter-item"><input type="checkbox"> Gucci</div>

<div id="brandMore" style="display:none">
  <div class="filter-item"><input type="checkbox"> Nike</div>
  <div class="filter-item"><input type="checkbox"> Adidas</div>
</div>
<div class="more-btn" onclick="toggleMore('brandMore',this)">More</div>

</div>
</div>

<!-- PRODUCTS -->
<div class="col-lg-9">
<div class="row g-4">

<!-- CARD -->
<div class="col-md-4">
<div class="product-card">
<div class="product-img-wrap">
<span class="badge-new">New</span>
<img src="product1.jpg" class="product-img">
<div class="overlay">
<div class="icon-btn"><i class="bi bi-eye"></i></div>
<div class="icon-btn"><i class="bi bi-cart-plus"></i></div>
</div>
</div>
<div class="product-body">
<div class="product-title">Women Stylish Top</div>
<div class="d-flex justify-content-between align-items-center mt-1">
<div class="rating">★★★★★</div>
<div class="price">$25</div>
</div>
</div>
</div>
</div>

<!-- copy more cards -->

</div>

<!-- PAGINATION -->
<nav class="mt-4">
<ul class="pagination justify-content-center">
<li class="page-item active"><a class="page-link">1</a></li>
<li class="page-item"><a class="page-link">2</a></li>
<li class="page-item"><a class="page-link">3</a></li>
</ul>
</nav>

</div>
</div>
</div>

<script>
function toggleMore(id,el){
  const box=document.getElementById(id);
  if(box.style.display==="none"){
    box.style.display="block";
    el.innerText="Less";
  }else{
    box.style.display="none";
    el.innerText="More";
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
