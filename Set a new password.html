<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set Password | Boho Soul</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #ffffff;
    }

    .page-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* LEFT SECTION */
    .form-section {
      width: 50%;
      padding: 60px 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo {
      margin-bottom: 40px;
    }

    .logo img {
      width: 120px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #000;
    }

    .sub-text {
      font-size: 14px;
      color: #666;
      margin-bottom: 35px;
      max-width: 420px;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
      max-width: 420px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 8px;
      color: #000;
    }

    input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #1e88e5;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 45px;
      cursor: pointer;
      color: #777;
    }

    .submit-btn {
      width: 420px;
      max-width: 100%;
      background: #1e88e5;
      border: none;
      padding: 14px;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: #166fc0;
    }

    /* RIGHT SECTION */
    .image-section {
      width: 50%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .image-card {
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .image-card img {
      width: 100%;
      display: block;
    }

    .slider-dots {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #d1d1d1;
      border-radius: 50%;
    }

    .dot.active {
      width: 22px;
      border-radius: 6px;
      background: #1e88e5;
    }

    /* RESPONSIVE */
    @media (max-width: 992px) {
      .page-wrapper {
        flex-direction: column;
      }

      .form-section,
      .image-section {
        width: 100%;
      }

      .form-section {
        padding: 40px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- LEFT FORM -->
    <div class="form-section">
      <div class="logo">
        <!-- Replace with your logo -->
        <img src="Boho_Soul-removebg-preview.png" alt="Boho Soul">
      </div>

      <h1>Set a password</h1>
      <p class="sub-text">
        Your previous password has been reset. Please set a new password for your account.
      </p>

      <div class="form-group">
        <label>Create Password</label>
        <input type="password" id="password" value="7789BM6X">
        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
      </div>

      <div class="form-group">
        <label>Re-enter Password</label>
        <input type="password" id="confirmPassword" value="7789BM6X">
        <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirmPassword', this)"></i>
      </div>

      <button class="submit-btn">Set Password</button>
    </div>

    <!-- RIGHT IMAGE -->
    <div class="image-section">
      <div class="image-card">
        <!-- Replace with your image -->
        <img src="https://images.unsplash.com/photo-1600180758890-6b94519a8ba6?q=80&w=1200" alt="Fashion">

        <div class="slider-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    function togglePassword(id, icon) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>

</body>
</html>
